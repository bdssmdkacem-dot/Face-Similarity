name: Android validation

on:
  push:
    branches: [feature/mvp-foundation]
  pull_request:
    branches: [feature/mvp-foundation]

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android
        run: bash scripts/bootstrap_android.sh

      - name: Persist Android platform
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android .gitignore .metadata
          if ! git diff --cached --quiet; then
            git commit -m "chore: bootstrap Android platform"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Download bundled face model
        run: |
          mkdir -p assets/models
          curl -L --fail --retry 3 \
            -o assets/models/librefacerec-l.onnx \
            https://huggingface.co/LibreYOLO/librefacerec-l/resolve/main/librefacerec-l.onnx
          echo "a7933ea5330113b01c9b60351d8f4c33003f145d847ac5f0e52ee2effe25c60  assets/models/librefacerec-l.onnx" | sha256sum -c -

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shabah-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
