name: face_similarity
description: A privacy-first celebrity lookalike app built with Flutter and Supabase.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.9.0
  google_mlkit_face_detection: ^0.13.1
  camera: ^0.11.0+2
  image: ^4.5.4
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.3
  flutter_riverpod: ^2.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
